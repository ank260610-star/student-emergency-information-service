<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南开建筑预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#bacbd0;color:#f8f4e9;font-family:system-ui}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:20px;left:20px;right:20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}h1{font-size:18px;margin:0 20px 0 0;color:#183b37}button,a{background:#173c37;color:white;border:0;padding:11px 14px;text-decoration:none;border-radius:4px;cursor:pointer}button.active{background:#d4ac4c;color:#19312c}footer{position:absolute;bottom:18px;left:20px;right:20px;padding:13px;background:#173c37df;font-size:12px;line-height:1.7}footer a{padding:0;color:#ffe19b;background:none}#error{color:#ffd575}</style>
<canvas id="view"></canvas><header><h1>津南 · 建筑预览</h1><button data-name="综合业务东楼">综合业务东楼</button><button data-name="综合业务西楼">综合业务西楼</button><button data-name="大通学生活动中心">大通学生活动中心</button><a id="play" href="/?landmark=east">前往游戏</a></header>
<footer><b id="building-name"></b> · 拖动旋转，滚轮缩放<br><span id="detail"></span><br><span id="error"></span><a id="reference" target="_blank" rel="noopener">查看实景资料</a></footer>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {officeModel,activityModel} from './additional-landmarks.js?v=buildings-2';
const scene=new T.Scene();scene.background=new T.Color(0xbacbd0);scene.add(new T.HemisphereLight(0xe9f4ff,0x8b7c60,2.3));const sun=new T.DirectionalLight(0xffecd6,2.8);sun.position.set(90,150,90);scene.add(sun);
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.toneMapping=T.ACESFilmicToneMapping;const camera=new T.PerspectiveCamera(45,1,.2,2000);let model,angle=.6,elevation=.42,distance=165,target=new T.Vector3(),drag=false,lastX=0,lastY=0;
const ground=new T.Mesh(new T.PlaneGeometry(500,500),new T.MeshStandardMaterial({color:0x87917d,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.5;scene.add(ground);
const world=p=>new T.Vector3((p.lon-117.3394)*87000,0,-(p.lat-38.988)*111000);
const data=await fetch('./work/campus-osm.json').then(r=>r.json());
function choose(name){const item=data.elements.find(e=>e.tags?.name===name);if(!item)throw Error('缺少建筑轮廓');if(model){scene.remove(model);const geometries=new Set(),materials=new Set();model.traverse(o=>{if(o.geometry)geometries.add(o.geometry);if(o.material)materials.add(o.material)});geometries.forEach(g=>g.dispose());materials.forEach(m=>{m.map?.dispose();m.dispose()})}const pts=item.geometry.map(world);model=name==='大通学生活动中心'?activityModel(pts):officeModel(pts,name);scene.add(model);const bounds=new T.Box3().setFromObject(model);bounds.getCenter(target);ground.position.x=target.x;ground.position.z=target.z;distance=bounds.getSize(new T.Vector3()).length()*1.55;document.querySelector('#building-name').textContent=name;document.querySelector('#detail').textContent=name==='大通学生活动中心'?'官网实拍参考：六翼轮廓、15 米高度、镂空幕墙；中庭及开孔分布为近似重建。':'设计院实拍参考：砖墙、低层门廊、退台与竖窗；楼高、背面和两楼差异仍待核实。';document.querySelector('#reference').href=model.userData.reference;document.querySelector('#play').href='/?landmark='+(name.includes('东楼')?'east':name.includes('西楼')?'west':'activity');document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.name===name));}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>choose(b.dataset.name));renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag){angle-=(e.clientX-lastX)*.008;elevation=T.MathUtils.clamp(elevation+(e.clientY-lastY)*.004,.05,1.35);lastX=e.clientX;lastY=e.clientY}};renderer.domElement.onwheel=e=>{e.preventDefault();distance=T.MathUtils.clamp(distance*Math.exp(e.deltaY*.001),40,500)};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();choose('综合业务东楼');function draw(){camera.position.set(target.x+Math.sin(angle)*distance*Math.cos(elevation),target.y+Math.sin(elevation)*distance,target.z+Math.cos(angle)*distance*Math.cos(elevation));camera.lookAt(target);renderer.render(scene,camera);requestAnimationFrame(draw)}draw();
</script></html>
