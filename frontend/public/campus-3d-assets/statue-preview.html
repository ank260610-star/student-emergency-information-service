<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周恩来铜像 · 三维检查</title><style>body{margin:0;background:#b8c4cd;color:#18352d;font:15px system-ui}canvas{display:block;touch-action:none}header{position:absolute;top:16px;left:16px;display:flex;gap:8px;flex-wrap:wrap}button,a{background:#173c32;color:#fff;border:0;border-radius:8px;padding:10px;text-decoration:none;cursor:pointer}footer{position:absolute;bottom:18px;left:16px;background:#173c32e8;color:#fff;padding:12px;border-radius:8px;max-width:600px}*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script><canvas></canvas><header><button data-view="full">全身</button><button data-view="face">面部</button><button data-view="side">侧脸</button><button data-view="back">背面</button><a href="/?landmark=statue">进入游戏</a></header><footer id="status">正在加载三维铜像…</footer><script type="module">
import * as T from 'three';import {createZhouStatue} from './zhou-statue.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#b8c4cd');scene.add(new T.HemisphereLight(0xeaf3ff,0x5b4431,2.8));const sun=new T.DirectionalLight(0xffeddb,3.8);sun.position.set(-3,5,4);scene.add(sun);const fill=new T.DirectionalLight(0xdcecff,2);fill.position.set(4,2,-3);scene.add(fill);
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.ACESFilmicToneMapping;const camera=new T.PerspectiveCamera(35,1,.01,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.15;controls.maxDistance=10;
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
document.addEventListener('contextmenu',e=>e.preventDefault());const params=new URLSearchParams(location.search);const model=createZhouStatue();model.scale.setScalar(.05);scene.add(model);await model.userData.ready;window.__statuePreview={scene,model,camera,controls,renderer};
scene.updateMatrixWorld(true);let faceCenter=new T.Vector3();model.traverse(o=>{if(o.name.includes('detailed_face'))new T.Box3().setFromObject(o).getCenter(faceCenter)});
function view(v){let target=new T.Vector3(0,1.10,0),pos=new T.Vector3(.15,1.25,4.8);if(v==='face'){target.copy(faceCenter);pos.copy(faceCenter).add(new T.Vector3(0,.015,.83))}if(v==='side'){target.copy(faceCenter);pos.copy(faceCenter).add(new T.Vector3(.88,.015,.01))}if(v==='back')pos.set(0,1.25,-4.8);controls.target.copy(target);camera.position.copy(pos);controls.update();}document.querySelectorAll('button').forEach(b=>b.onclick=()=>view(b.dataset.view));view(params.get('view')||'full');document.querySelector('#status').textContent='周恩来总理铜像 · 拖动旋转，滚轮或双指缩放。依据真实照片重建，未拍到的表面为推定。';
function draw(){controls.update();renderer.render(scene,camera);requestAnimationFrame(draw)}draw();
</script></html>
